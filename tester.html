<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CueTester">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="white">
<!--
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="icon" type="image/png" href="./icons/favicon.ico">
  <link rel="manifest" href="manifest.json">
-->
  <title>CueTester</title>
  <link rel="stylesheet" href="css/tester.css" />
  <link rel="stylesheet" href="css/global.css" />
</head>
<body class="preload">
  <header>
    <h1 id="header-title"><a href="index.html"><span class="blue-text">Cue</span>Tester</a></h1>
    <div class="menu">
      <!--
      <button id="settingsButton" class="circle-btn">
        <img src="assets/svg/2699.svg" alt="Settings" width="32" height="32" />
      </button>
      -->
    </div>
  </header>

  <main id="cue-content">
    <!-- Message bubbles (narration, speaker, user) will be dynamically inserted here -->
    <div id="settingsMenu" class="hidden">
        <h2>Settings</h2>

        <div class="setting-row">
            <label for="fontSizeSlider">Font Size:</label>
            <input type="range" id="fontSizeSlider" min="100" max="160" value="100" style="margin: 5px 0;">
            <div id="fontSizePreview" class="font-preview">
                This is a preview of the message text.
            </div>
        </div>

    </div>
  </main>
  <button id="prevQuestionButton" class="nav-arrow nav-prev hidden" aria-label="Previous question">‹</button>
  <button id="nextQuestionButton" class="nav-arrow nav-next hidden" aria-label="Next question">›</button>
  <script src="js/tester.js"></script>
</body>
</html>
