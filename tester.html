<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CueTester">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="white">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="icon" type="image/png" href="./icons/favicon.ico">
<!--
  <link rel="manifest" href="manifest.json">
-->
  <title>CueTester</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/tester.css" />
</head>
<body class="preload">
  <header>
    <div class="app-title">
      <h1 id="header-title"><a href="index.html"><span class="blue-text">Cue</span>Tester</a></h1>
      <span class="subheader-title">LEARN TOEIC</h2>
    </div>
    <div id="position-indicator" class="position-indicator">
      <span id="lesson-indicator" class="lesson-indicator">Test 1</span>
      <span id="question-indicator" class="question-indicator">1/100</span>
    </div>
    <button id="menu-expander" type="button" class="menuExpander" aria-expanded="false" aria-label="Expand menu">≡</button>
  </header>

  <div id="expanded-menu" class="expanded-menu">
    <button class="menu-item"><img class="menu-icon" src="assets/svg/E25E.svg"><span class="menu-label">Lesson List</span></button>
    <button class="menu-item" id="hint-button"><img class="menu-icon" src="assets/svg/1F4A1.svg"><span class="menu-label">Hint</span></button>
    <button class="menu-item"><img class="menu-icon" src="assets/svg/language-translation.svg"><span class="menu-label">Translation</span></button>
    <button class="menu-item"><img class="menu-icon" src="assets/svg/2754.svg"><span class="menu-label">Help</span></button>
    <button id="settings-button" class="menu-item"><img class="menu-icon" src="assets/svg/2699.svg"><span class="menu-label">Settings</span></button>
  </div>

  <div id="settings-menu" class="settings-menu">
    <div class="settings-item">
      <span class="settings-label">Translation Language:</span>
      <select id="language-selector" class="language-selector">中文（繁體）</select>
    </div>
  </div>

  <main id="cue-content">
    <!-- Message bubbles (narration, speaker, user) will be dynamically inserted here -->
    <div id="settingsMenu" class="hidden">
        <h2>Settings</h2>

        <div class="setting-row">
            <label for="fontSizeSlider">Font Size:</label>
            <input type="range" id="fontSizeSlider" min="100" max="160" value="100" style="margin: 5px 0;">
            <div id="fontSizePreview" class="font-preview">
                This is a preview of the message text.
            </div>
        </div>

    </div>
  </main>
  <button id="prevQuestionButton" class="nav-arrow nav-prev hidden" aria-label="Previous question"><span class="arrow-left">‹</span></button>
  <button id="nextQuestionButton" class="nav-arrow nav-next hidden" aria-label="Next question"><span id="next-arrow" class="arrow-right">›</span></button>
  <script src="js/tester.js"></script>
</body>
</html>
